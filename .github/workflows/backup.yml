name: Database backup

# The free MongoDB Atlas tier has no automatic backups. This exports all
# collections once a week and keeps the files as a private workflow artifact.
# Requires the repository secret MONGODB_URI (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - run: node scripts/backup.js backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - uses: actions/upload-artifact@v4
        with:
          name: hobbook-backup-${{ github.run_id }}
          path: backend/backup
          retention-days: 60
          if-no-files-found: error
